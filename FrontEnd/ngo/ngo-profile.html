<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>WasteNot – NGO Settings</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="ngo-base.css"> 
    <link rel="stylesheet" href="ngo-profile.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div class="logo-mark">WasteNot</div>
            </div>

            <nav class="sidebar-nav">
                <a href="ngo-dashboard.html" class="nav-item">Dashboard</a>
                <a href="ngo-marketplace.html" class="nav-item">Available Donations</a>
                <a href="ngo-claims.html" class="nav-item">Requests</a>
                <a href="ngo-profile.html" class="nav-item active">Profile</a>
            </nav>

            <button id="logoutBtn" class="logout-btn">Logout</button>
        </aside>

        <main class="main">
            <header class="topbar">
                <div>
                    <h1 class="topbar-title">Account Profile</h1>
                    <p class="topbar-subtitle">Manage your information and account security.</p>
                </div>
                <div class="topbar-actions">
                    <button class="icon-btn" aria-label="Notifications">🔔</button>
                    <div class="avatar" id="avatarInitial">N</div>
                </div>
            </header>

            <div class="settings-container">
                
                <section class="settings-section profile-section">
                    <h2>Profile Details</h2>
                    <form id="profileForm" class="profile-form-grid">
                        
                        <div class="profile-left">
                            <div class="profile-avatar-wrapper">
                                <div class="profile-avatar-large">N</div> 
                            </div>
                            
                            <div class="form-group">
                                <label for="organizationName">Organization Name</label>
                                <input type="text" id="organizationName" name="organizationName" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="contactPerson">Contact Person</label>
                                <input type="text" id="contactPerson" name="contactPerson" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="phone">Phone</label>
                                <input type="tel" id="phone" name="phone">
                            </div>
                            
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" name="email" readonly disabled>
                            </div>
                        </div>

                        <div class="profile-right">
                            <div class="form-group">
                                <label for="address">Address / Pickup Area</label>
                                <input type="text" id="address" name="address" required>
                            </div>

                            <div class="form-group about-group">
                                <label for="about">About (short)</label>
                                <textarea id="about" name="about" rows="6"></textarea>
                            </div>
                            
                            <div class="action-buttons">
                                <button type="submit" class="btn-primary">Save Profile</button>
                                <button type="button" id="resetProfile" class="btn-secondary">Reset</button>
                            </div>
                        </div>
                    </form>
                </section>

                <section class="settings-section">
                    <h2>Account Security</h2>
                    <form id="passwordForm" class="security-form">
                        
                        <div class="form-group">
                            <label for="currentPassword">Current Password</label>
                            <input type="password" id="currentPassword" name="currentPassword" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="newPassword">New Password</label>
                            <input type="password" id="newPassword" name="newPassword" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="confirmPassword">Confirm New Password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" required>
                        </div>
                        
                        <div>
                            <button type="submit" class="btn-primary">Change Password</button>
                        </div>  
                    </form>
                </section>
                
            </div>
            
            <div id="toast" class="toast"></div>

        </main>
    </div>
    
    <script src="ngo-profile.js"></script>
    <script src="../notifications.js"></script>
</body>
</html>
