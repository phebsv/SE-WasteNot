<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Listings</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="ngo-base.css" />
  <link rel="stylesheet" href="ngo-marketplace.css" />
</head>

<body>
  <div class="layout">

   <aside class="sidebar">
    <div class="sidebar-logo">
        <div class="logo-mark">WasteNot</div>
    </div>

    <nav class="sidebar-nav">
      <a href="ngo-dashboard.html" class="nav-item">Dashboard</a>
      <a href="ngo-marketplace.html" class="nav-item active">Available Donations</a>
      <a href="ngo-claims.html" class="nav-item">Requests</a>
      <a href="ngo-profile.html" class="nav-item">Profile</a>
    </nav>
    <button class="logout-btn" id="logoutBtn">Logout</button>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main">

      <!-- TOP BAR -->
      <div class="topbar">
        <div>
          <h1 class="topbar-title">Available <span class="accent">Donations</span></h1>
          <p class="topbar-subtitle">Browse items and request what you need</p>
        </div>

        <div class="topbar-actions">
          <button class="icon-btn">🔔</button>
          <div class="avatar" id="avatarInitial">N</div>
        </div>
      </div>

      <!-- FILTER SECTION -->
      <section class="search-row">
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="searchInput"
            class="market-search"
            placeholder="Search products, partners..."
          />
        </div>
      </section>

      <!-- Filters Sidebar -->
      <section class="filters-section">
        <div class="filter-panel">
          <div class="filter-group">
            <h3 class="filter-title">Category</h3>
            <div id="categoryFilters" class="filter-options">
              <!-- Categories will be populated by JS -->
            </div>
          </div>

          <div class="filter-group">
            <h3 class="filter-title">Partner</h3>
            <div id="partnerFilters" class="filter-options">
              <!-- Partners will be populated by JS -->
            </div>
          </div>
        </div>
      </section>

      <!-- PRODUCT GRID -->
      <div class="product-grid" id="productGrid">
        <!-- Products will be populated by JavaScript -->
      </div>
      </div>

    </main>
  </div>

  <script src="ngo-marketplace.js"></script>
  <script src="../notifications.js"></script>
</body>
</html>
