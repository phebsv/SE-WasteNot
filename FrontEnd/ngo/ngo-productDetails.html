<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Request Details</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="ngo-base.css" />
  <link rel="stylesheet" href="ngo-marketplace.css" />
  <link rel="stylesheet" href="ngo-productDetails.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-logo"><div class="logo-mark">WasteNot</div></div>
      <nav class="sidebar-nav">
        <a href="ngo-dashboard.html" class="nav-item">Dashboard</a>
        <a href="ngo-marketplace.html" class="nav-item">Available Donations</a>
        <a href="ngo-claims.html" class="nav-item active">Requests</a>
        <a href="ngo-profile.html" class="nav-item">Profile</a>
      </nav>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1 class="topbar-title">Request Details</h1>
          <p class="topbar-subtitle">View full details of your donation request</p>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" aria-label="Notifications">🔔</button>
          <div class="avatar">P</div>
        </div>
      </div>

      <button class="back-button" onclick="history.back()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back
      </button>

      <!-- DETAILS CARD -->
      <section class="details-section">
        <div class="details-card">
          <!-- HEADER WITH LOGO AND STATUS -->
          <div class="details-header">
            <div class="details-logo">
              <img id="detailsLogo" src="placeholder-logo.jpg" alt="Provider logo" />
            </div>
            <div class="details-header-info">
              <h1 id="detailsItem">Item Name</h1>
              <p id="detailsProvider" class="muted">Provider Name</p>
              <div class="status-badge" id="detailsStatus">Pending Provider Confirmation</div>
              <div class="countdown-section">
                <span class="countdown-label">Expiring Soon</span>
                <span class="countdown-timer" id="expiryTimer">--h --m --s</span>
              </div>
            </div>
          </div>

          <!-- EDIT BUTTON -->
          <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button id="editToggleBtn" class="btn primary" style="flex: 1;">✏️ Edit Details</button>
            <button id="saveChangesBtn" class="btn" style="flex: 1; display: none; background-color: #4CAF50; color: white;">💾 Save Changes</button>
            <button id="cancelEditBtn" class="btn ghost" style="flex: 1; display: none;">Cancel</button>
          </div>

          <!-- MAIN DETAILS -->
          <div class="details-grid" id="detailsGrid">
            <div class="detail-row">
              <label class="detail-label">Item Name</label>
              <p id="detailItemName" class="detail-value">-</p>
              <input type="text" id="editItemName" class="detail-input" style="display: none;" />
            </div>
            <div class="detail-row">
              <label class="detail-label">Provider</label>
              <p id="detailProvider" class="detail-value">-</p>
              <input type="text" id="editProvider" class="detail-input" style="display: none;" />
            </div>
            <div class="detail-row">
              <label class="detail-label">Quantity</label>
              <p id="detailQty" class="detail-value">-</p>
              <input type="text" id="editQty" class="detail-input" style="display: none;" placeholder="e.g., 50 Servings" />
            </div>
            <div class="detail-row">
              <label class="detail-label">Tagged As</label>
              <p id="detailTagged" class="detail-value">-</p>
              <input type="text" id="editTagged" class="detail-input" style="display: none;" placeholder="e.g., Urgent Donation" />
            </div>
            <div class="detail-row">
              <label class="detail-label">Expiry Date</label>
              <p id="detailExpiry" class="detail-value">-</p>
              <input type="date" id="editExpiry" class="detail-input" style="display: none;" />
            </div>
            <div class="detail-row">
              <label class="detail-label">Store Location</label>
              <p id="detailLocation" class="detail-value">-</p>
              <input type="text" id="editLocation" class="detail-input" style="display: none;" />
            </div>
            <div class="detail-row">
              <label class="detail-label">Pickup Window</label>
              <p id="detailPickup" class="detail-value">-</p>
              <input type="text" id="editPickup" class="detail-input" style="display: none;" placeholder="e.g., 2:00-3:00 PM" />
            </div>
            <div class="detail-row">
              <label class="detail-label">Request Status</label>
              <p id="detailRequestStatus" class="detail-value">-</p>
            </div>
            <div class="detail-row">
              <label class="detail-label">Submitted On</label>
              <p id="detailCreatedAt" class="detail-value">-</p>
            </div>
          </div>

          <!-- CONTACT SECTION -->
          <div class="contact-section">
            <h3>Contact Provider</h3>
            <div class="contact-grid">
              <button class="btn-contact" id="callBtn">📞 Call</button>
              <button class="btn-contact" id="messageBtn">💬 Message</button>
              <button class="btn-contact" id="directionsBtn">🗺️ Directions</button>
            </div>
          </div>

          <!-- ACTIONS -->
          <div class="action-buttons" style="display: flex; gap: 10px;">
            <button id="cancelRequestBtn" class="btn ghost" style="flex: 1;">✗ Cancel Request</button>
            <button id="backBtn" class="btn primary" style="flex: 1;">← Back to Claims</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="ngo-productDetails.js"></script>
  <script src="ngo-marketplace.js"></script>
  <script src="../notifications.js"></script>
</body>
</html>
