<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>WasteNot – NGO Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    />
    <link rel="stylesheet" href="ngo-base.css" />
    <link rel="stylesheet" href="ngo-dashboard.css" />
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <span class="logo-mark">WasteNot</span>
            </div>

            <nav class="sidebar-nav">
                <a href="ngo-dashboard.html" class="nav-item active">Dashboard</a>
                <a href="ngo-marketplace.html" class="nav-item">Available Donations</a>
                <a href="ngo-claims.html" class="nav-item">My Request / Claims</a>
                <a href="ngo-profile.html" class="nav-item">Account</a>
            </nav>

            <button class="logout-btn">Logout</button>
        </aside>

        <main class="main">
            <header class="topbar">
                <div>
                    <h1 class="topbar-title">Welcome, <span class="accent" id="ngo-name-display">NGO</span></h1>
                    <p class="topbar-subtitle">
                        Here's a quick overview of your claims and pickup schedule.</p>
                </div>

                <div class="topbar-actions">
                    <button class="icon-btn" aria-label="Notifications">
                        🔔
                    </button>
                    <div class="avatar" title="NGO User">
                        H
                    </div>
                </div>
            </header>

            <section class="grid-two">
                
                <div class="summary-column">
                    <article class="summary-card-ngo">
                        <p class="summary-label">Active Requests:</p>
                        <p class="summary-value" id="ngoActiveRequests">0</p>
                    </article>

                    <article class="summary-card-ngo">
                        <p class="summary-label">Received Donations:</p>
                        <p class="summary-value" id="ngoReceivedDonations">0</p>
                    </article>

                    <article class="summary-card-ngo accent-pending">
                        <p class="summary-label">Pending Requests:</p>
                        <p class="summary-value" id="ngoPendingRequests">0</p>
                    </article>
                </div>

                <article class="panel panel-pickups">
                    <h2 class="panel-title">Today's Pickups:</h2>
                    <div class="pickup-list-wrapper">
                        <div class="pickup-list" id="ngoTodaysPickups"></div>
                    </div>
                </article>

            </section>

            <section class="panel panel-claims-full">
                <div class="panel-header">
                    <h2 class="panel-title claims-title">Recent Claims</h2>
                </div>
                
                <div class="claims-table-wrapper">
    <table class="claims-table">
        <thead>
            <tr>
                <th>Provider</th>
                <th>Item</th>
                <th>Pickup time</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="ngoRecentClaimsBody"></tbody>
    </table>
</div>
            </section>

        </main>
    </div>
        <script src="ngo-dashboard.js"></script>
        <script src="../notifications.js"></script>
        </body>
    </html>
