<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Settings</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../ngo/ngo-base.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-logo"><div class="logo-mark">WasteNot</div></div>
      <nav class="sidebar-nav">
        <a href="admin-dashboard.html" class="nav-item">Dashboard</a>
        <a href="admin-settings.html" class="nav-item active">Settings</a>
      </nav>
      <button class="logout-btn">Logout</button>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1 class="topbar-title">Settings</h1>
          <p class="topbar-subtitle">System configuration and preferences</p>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" aria-label="Notifications">🔔</button>
          <div class="avatar">A</div>
        </div>
      </div>

      <section class="panel">
        <label class="label">Site Name</label>
        <input id="siteName" class="input" />
        <label class="label">Maintenance Mode</label>
        <select id="maintenance" class="input"><option value="off">Off</option><option value="on">On</option></select>
        <div class="actions"><button id="saveSettings" class="btn primary">Save</button></div>
      </section>
    </main>
  </div>

  <script src="../notifications.js"></script>
  <script src="admin.js"></script>
</body>
</html>
