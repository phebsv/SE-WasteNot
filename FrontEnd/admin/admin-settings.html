<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../ngo/ngo-base.css" />
    <link rel="stylesheet" href="admin.css" />
    <link rel="stylesheet" href="admin-settings.css" /> 
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-logo"><div class="logo-mark">WasteNot</div></div>
            <nav class="sidebar-nav">
                <a href="admin-dashboard.html" class="nav-item">Dashboard</a>
                <a href="admin-manage-donations.html" class="nav-item">Manage Items</a>
                <a href="admin-manage-users.html" class="nav-item">Manage Users</a>
                <a href="admin-approvals.html" class="nav-item">Approvals</a>
                <a href="admin-logs.html" class="nav-item">Activity Logs</a>
                <a href="admin-announcements.html" class="nav-item">Announcements</a>
                <a href="admin-analytics.html" class="nav-item">Analytics</a>
                <a href="admin-settings.html" class="nav-item active">Settings</a>
            </nav>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </aside>

        <main class="main">
            <div class="topbar">
                <div>
                    <h1 class="topbar-title">System Settings</h1>
                    <p class="topbar-subtitle">System configuration and security preferences</p>
                </div>
                <div class="topbar-actions">
                    <button class="icon-btn" aria-label="Notifications">🔔</button>
                    <div class="avatar" id="avatarInitial">A</div>
                </div>
            </div>

            <div class="settings-container">

                <section class="settings-section">
                    <h2>System Configuration</h2>
                    <form id="systemForm" class="security-form"> 
                        
                        <div class="form-group">
                            <label for="siteName">Site Name</label>
                            <input type="text" id="siteName" name="siteName" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="defaultPickupRadius">Default Pickup Radius (km)</label>
                            <input type="number" id="defaultPickupRadius" name="defaultPickupRadius" min="1" max="100" value="10">
                        </div>

                        <div class="form-group">
                            <label for="maintenance">Maintenance Mode</label>
                            <select id="maintenance" name="maintenance">
                                <option value="off">Off (Site operational)</option>
                                <option value="on">On (Temporary downtime)</option>
                            </select>
                        </div>
                        
                        <div class="action-buttons">
                            <button type="submit" class="btn-primary">Save System Settings</button>
                            <button type="button" id="resetSystem" class="btn-secondary">Reset</button>
                        </div>
                    </form>
                </section>
                
                <section class="settings-section">
                    <h2>Admin Account Security</h2>
                    <form id="passwordForm" class="security-form">
                        
                        <div class="form-group">
                            <label for="adminEmail">Admin Email</label>
                            <input type="email" id="adminEmail" name="adminEmail" value="admin@wastenot.com" readonly disabled>
                        </div>

                        <div class="form-group">
                            <label for="currentPassword">Current Password</label>
                            <input type="password" id="currentPassword" name="currentPassword" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="newPassword">New Password</label>
                            <input type="password" id="newPassword" name="newPassword" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="confirmPassword">Confirm New Password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" required>
                        </div>
                        
                        <div>
                            <button type="submit" class="btn-primary">Change Admin Password</button>
                        </div>  
                    </form>
                </section>
                
            </div>
            <div id="toast" class="toast"></div>
        </main>
    </div>

    <script src="admin-settings.js"></script>
    <script src="../notifications.js"></script>
</body>
</html>
