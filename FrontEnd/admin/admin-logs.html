<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pending Approvals</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../ngo/ngo-base.css" />
    <link rel="stylesheet" href="admin.css" />
    <link rel="stylesheet" href="admin-manage-users.css" /> 
    <link rel="stylesheet" href="admin-approvals.css" />
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-logo"><div class="logo-mark">WasteNot</div></div>
            <nav class="sidebar-nav">
                <a href="admin-dashboard.html" class="nav-item">Dashboard</a>
                <a href="admin-manage-donations.html" class="nav-item">Manage Items</a>
                <a href="admin-manage-users.html" class="nav-item">Manage Users</a>
                <a href="admin-approvals.html" class="nav-item">Approvals</a>
                <a href="admin-logs.html" class="nav-item active">Activity Logs</a>
                <a href="admin-announcements.html" class="nav-item">Announcements</a>
                <a href="admin-analytics.html" class="nav-item">Analytics</a>
                <a href="admin-settings.html" class="nav-item">Settings</a>
            </nav>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </aside>

        <main class="main">
            <div class="topbar">
                <div>
                    <h1 class="topbar-title">Pending Approvals</h1>
                    <p class="topbar-subtitle">Review and decide on new Provider and NGO applications.</p>
                </div>
                <div class="topbar-actions">
                    <button class="icon-btn" aria-label="Notifications">🔔</button>
                    <div class="avatar" id="avatarInitial">A</div>
                </div>
            </div>

            <section class="panel">
                
                <nav class="user-tabs">
                    <button class="tab-btn active" data-tab="provider">Provider Approvals <span class="badge" id="providerCount">0</span></button>
                    <button class="tab-btn" data-tab="ngo">NGO Approvals <span class="badge" id="ngoCount">0</span></button>
                </nav>

                <div class="panel-header user-search-header">
                    <input id="approvalSearch" placeholder="Search by organization name or email..." class="filter-input" />
                    </div>

                <div class="tab-content-wrapper">
                    
                    <div id="provider" class="tab-content active">
                        <table class="admin-table">
                            <thead><tr><th>ID</th><th>Organization Name</th><th>Contact Person</th><th>Submitted Date</th><th>Documents</th><th>Actions</th></tr></thead>
                            <tbody id="providerTbody"></tbody>
                        </table>
                    </div>

                    <div id="ngo" class="tab-content">
                        <table class="admin-table">
                            <thead><tr><th>ID</th><th>NGO Name</th><th>Contact Person</th><th>Area</th><th>Documents</th><th>Actions</th></tr></thead>
                            <tbody id="ngoTbody"></tbody>
                        </table>
                    </div>
                </div>
                
            </section>
        </main>
    </div>

    <script src="admin-logs.js"></script>
</body>
</html>
