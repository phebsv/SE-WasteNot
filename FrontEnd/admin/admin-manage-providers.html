<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manage Providers</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../ngo/ngo-base.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-logo"><div class="logo-mark">WasteNot</div></div>
      <nav class="sidebar-nav">
        <a href="admin-dashboard.html" class="nav-item active">Dashboard</a>
        <a href="admin-manage-providers.html" class="nav-item">Manage Providers</a>
        <a href="admin-manage-ngos.html" class="nav-item">Manage NGOs</a>
        <a href="admin-manage-donations.html" class="nav-item">Manage Donations</a>
        <a href="admin-manage-users.html" class="nav-item">Manage Users</a>
        <a href="admin-approvals.html" class="nav-item">Approvals</a>
        <a href="admin-logs.html" class="nav-item">Activity Logs</a>
        <a href="admin-announcements.html" class="nav-item">Announcements</a>
        <a href="admin-analytics.html" class="nav-item">Analytics</a>
        <a href="admin-settings.html" class="nav-item">Settings</a>
      </nav>
      <button class="logout-btn">Logout</button>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1 class="topbar-title">Manage Providers</h1>
          <p class="topbar-subtitle">Approve, edit or remove provider accounts</p>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" aria-label="Notifications">🔔</button>
          <div class="avatar">A</div>
        </div>
      </div>

      <section class="panel">
        <div class="panel-header">
          <input id="providerSearch" placeholder="Search providers..." class="market-search" />
        </div>
        <table id="providersTable" class="admin-table">
          <thead><tr><th>Provider</th><th>Location</th><th>Contact</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="../notifications.js"></script>
  <script src="admin.js"></script>
</body>
</html>
