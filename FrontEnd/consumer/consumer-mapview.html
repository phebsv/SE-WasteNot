<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WasteNot – Consumer Map View</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="consumer-mapview.css">
</head>

<body>

  <div class="layout">

    <!-- ========== SIDEBAR ========== -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <span class="logo-mark">WasteNot</span>
      </div>

      <nav class="sidebar-nav">
        <a href="consumer-dashboard.html" class="nav-item">Dashboard</a>
        <a href="consumer-marketplace.html" class="nav-item">Marketplace</a>
        <a href="consumer-mapview.html" class="nav-item active">Map View</a>
        <a href="claim.html" class="nav-item">Claims</a>
        <a href="consumer-profile.html" class="nav-item">Account</a>
      </nav>

      <button id="logoutBtn" class="logout">Logout</button>
    </aside>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="main">

      <!-- TOP BAR -->
          <div class="topbar">
            <div>
                <h1 class="topbar-title">Map View</h1>
                <p class="topbar-subtitle">See our partners near you</p>
            </div>
            <div class="topbar-actions">
              <button class="icon-btn" aria-label="Notifications">🔔</button>
              <div class="avatar" title="You">P</div>
            </div>
        </div>


      <!-- MAP CARD -->
      <div class="map-card">
        <img src="map-static.jpg" class="map-image" alt="Map showing providers">

        <!-- Provider pins (fake interactive) -->
        <div class="pin" data-id="1" style="top: 38%; left: 52%;"></div>
        <div class="pin" data-id="2" style="top: 45%; left: 60%;"></div>
        <div class="pin" data-id="3" style="top: 58%; left: 40%;"></div>
        <div class="pin" data-id="4" style="top: 62%; left: 70%;"></div>

        <!-- Pop-up box -->
        <div id="popup" class="popup hidden">
          <h3 id="popupName"></h3>
          <p id="popupDistance"></p>
          <button id="viewDetailsBtn" class="popup-btn">View Details</button>
        </div>
      </div>

      <div class="bottom-row">
        <p class="hint">Click pinned for details</p>
        <button id="filterBtn" class="filter-btn">Filter the distance ⚙️</button>
      </div>

    </main>

  </div>

  <script src="consumer-mapview.js"></script>
   <script src="../notifications.js"></script>
</body>
</html>
