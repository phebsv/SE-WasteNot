<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WasteNot – Consumer Map View</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Leaflet CSS (OpenStreetMap) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="consumer-mapview.css">
</head>

<body>

  <div class="layout">

    <!-- ========== SIDEBAR ========== -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <span class="logo-mark">WasteNot</span>
      </div>

      <nav class="sidebar-nav">
        <a href="consumer-dashboard.html" class="nav-item">Dashboard</a>
        <a href="consumer-marketplace.html" class="nav-item">Marketplace</a>
        <a href="consumer-mapview.html" class="nav-item active">Map View</a>
      <a href="consumer-orders.html" class="nav-item">Claims</a>
        <a href="consumer-profile.html" class="nav-item">Account</a>
      </nav>

      <button id="logoutBtn" class="logout">Logout</button>
    </aside>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="main">

      <!-- TOP BAR -->
          <div class="topbar">
            <div>
                <h1 class="topbar-title">Map View</h1>
                <p class="topbar-subtitle">See our partners near you</p>
            </div>
            <div class="topbar-actions">
              <button class="icon-btn" aria-label="Notifications">🔔</button>
              <div class="avatar" title="You">P</div>
            </div>
        </div>


      <!-- MAP CARD -->
      <div class="map-card">
        <div id="map" class="leaflet-map"></div>
        
        <!-- Provider info sidebar -->
        <div id="providerInfo" class="provider-info hidden">
          <button id="closeProviderBtn" class="close-btn">×</button>
          <h3 id="providerName"></h3>
          <p id="providerDistance" class="distance"></p>
          <p id="providerAddress" class="address"></p>
          <div class="provider-details">
            <span id="providerRating" class="rating"></span>
            <span id="providerHours" class="hours"></span>
          </div>
          <button id="viewDetailsBtn" class="provider-btn">📍 View Directions</button>
          <button id="contactBtn" class="provider-btn secondary">📞 Contact Provider</button>
        </div>
      </div>

      <div class="bottom-row">
        <div class="location-info">
          <p id="currentLocation" class="location-text">📍 Getting your location...</p>
          <p id="searchRadius" class="radius-text">Search radius: <span id="radiusValue">10</span> km</p>
        </div>
        <div class="controls">
          <input type="range" id="radiusSlider" min="1" max="50" value="10" class="radius-slider">
          <button id="recenterBtn" class="btn-secondary">🎯 My Location</button>
        </div>
      </div>

    </main>

  </div>

  <!-- Leaflet JavaScript (OpenStreetMap) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="consumer-mapview.js"></script>
  <script src="../notifications.js"></script>
</body>
</html>
