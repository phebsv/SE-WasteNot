<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Listing – For Sale</title>

  <!-- Use your existing CSS -->
  <link rel="stylesheet" href="partner-dashboard.css">
  <link rel="stylesheet" href="toast.css">

  <!-- Extra CSS tweaks for create pages -->
  <style>
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background: #ffffff;
      color: var(--green-dark);
      font-weight: 600;
      text-decoration: none;
      width: fit-content;
      transition: background-color 0.16s ease, transform 0.16s ease, box-shadow 0.16s ease;
    }

    .back-btn:hover {
      background: var(--green-soft);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
    }
    .create-wrapper {
      max-width: 900px;
      margin: 20px auto;
      padding: 40px;
      background: #f9faf4;
      border-radius: 20px;
    }

    .create-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 30px;
    }

    .photo-box {
      width: 100%;
      height: 220px;
      background: #e8e8e8;
      border-radius: 15px;
      border: 2px dashed #bbb;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      cursor: pointer;
      margin-bottom: 25px;
      position: relative;
      overflow: hidden;
    }

    .photo-box img {
      height: 100%;
      width: 100%;
      object-fit: cover;
      display: none;
    }

    .photo-box.has-image img {
      display: block;
    }

    .photo-box.has-image .upload-text {
      display: none;
    }

    .upload-text {
      text-align: center;
      color: #555;
      font-size: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 20px;
    }

    .form-input {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      width: 100%;
      font-size: 15px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 13px;
      font-weight: 600;
      color: #555;
    }

    .create-btn {
      margin-top: 25px;
      width: 180px;
      padding: 14px;
      background: #1f7a1f;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      cursor: pointer;
      font-weight: 600;
    }

    .create-btn:hover {
      background: #166016;
    }
  </style>
</head>

<body>

  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-mark">WasteNot</div>
        <p class="logo-sub">Partner</p>
      </div>

      <nav class="sidebar-nav">
        <a href="partner-dashboard.html" class="nav-item">Dashboard</a>
        <a href="partner-listings.html" class="nav-item active">My Listings</a>
        <a href="partner-pickups.html" class="nav-item">Request / Claims</a>
        <a href="partner-inventory.html" class="nav-item">Inventory</a>
        <a href="partner-impact.html" class="nav-item">Impact Report</a>
        <a href="partner-settings.html" class="nav-item">Settings</a>
      </nav>

      <button id="logoutBtn" class="logout-btn">Logout</button>
    </aside>

    <!-- MAIN -->
    <main class="main">


      <!-- CONTENT -->
      <div class="create-wrapper">

        <a class="back-btn" href="partner-listings.html">← Back</a>

        <h1 class="create-title">Create Sale Listing</h1>

        <!-- PHOTO UPLOAD -->
        <label class="photo-box" id="photoBox">
          <img id="previewImg">
          <div class="upload-text">
            <div style="font-size:45px;">📷</div>
            <p>Add Photos</p>
          </div>
          <input type="file" id="photoInput" accept="image/*" style="display:none;">
        </label>

        <!-- FORM -->
        <div class="form-grid">
          <input type="text" id="itemName" class="form-input" placeholder="Product Name">
          <input type="number" id="itemQty" class="form-input" placeholder="Quantity">

          <input type="number" id="itemPrice" class="form-input" placeholder="Current Price (₱)">
          <select id="itemCategory" class="form-input">
            <option disabled selected>Type of Product</option>
            <option>Breads</option>
            <option>Drinks</option>
            <option>Meals</option>
            <option>Canned Goods</option>
            <option>Vegetables</option>
          </select>

          <div class="field-group">
            <div class="field-label">Production Date - when the item was made</div>
            <input type="date" id="prodDate" class="form-input" aria-label="Production Date - when the item was made">
          </div>

          <div class="field-group">
            <div class="field-label">Expiry Date - last day it can be sold/picked up</div>
            <input type="date" id="expDate" class="form-input" aria-label="Expiry Date - last day it can be sold/picked up">
          </div>

          <input type="text" id="pickupWindow" class="form-input" placeholder="Pickup Window (e.g. 4PM - 8PM)">
        </div>

        <button id="createBtn" type="button" class="create-btn">Create</button>
      </div>

    </main>
  </div>

  <div id="toastContainer"></div>

  <script src="partner-data.js"></script>
  <script src="toast.js"></script>
  <script src="../notifications.js"></script>

  <!-- MAIN JS -->
  <script>
    const PRODUCTS_API = "http://localhost:8081/api/products";

    function notify(message, type = 'info', withButton = false) {
      if (typeof showToast === 'function') {
        try {
          showToast(message, type, withButton);
          return;
        } catch (_) {
          // fall through to alert
        }
      }
      alert(String(message));
    }

    // Photo Upload
    const photoBox = document.getElementById("photoBox");
    const photoInput = document.getElementById("photoInput");
    const previewImg = document.getElementById("previewImg");

    if (photoBox && photoInput) {
      photoBox.onclick = () => photoInput.click();
    }

    if (photoInput && previewImg && photoBox) {
      photoInput.onchange = () => {
        const file = photoInput.files && photoInput.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = () => {
          previewImg.src = String(reader.result || "");
          photoBox.classList.add("has-image");
        };
        reader.readAsDataURL(file);
      };
    }

    function toIsoStartOfDay(dateStr) {
      if (!dateStr) return null;
      // Backend expects LocalDateTime; send ISO date-time.
      return `${dateStr}T00:00:00`;
    }

    async function createSaleListing() {
      const nameEl = document.getElementById('itemName');
      const qtyEl = document.getElementById('itemQty');
      const priceEl = document.getElementById('itemPrice');
      const categoryEl = document.getElementById('itemCategory');
      const prodDateEl = document.getElementById('prodDate');
      const expDateEl = document.getElementById('expDate');
      const pickupEl = document.getElementById('pickupWindow');

      const name = (nameEl?.value || '').trim();
      const qty = Number(qtyEl?.value);
      const price = Number(priceEl?.value);
      const categoryRaw = String(categoryEl?.value || "").trim();
      const prodDateValue = String(prodDateEl?.value || '');
      const expDateValue = String(expDateEl?.value || '');
      const pickup = (pickupEl?.value || '').trim();
      const imageUrl = (previewImg?.src || '').trim() || "https://via.placeholder.com/600x300";

      const category = categoryRaw.toLowerCase();
      const isCategoryValid = categoryRaw && !/^type\s+of\s+product$/i.test(categoryRaw);

      const pickupFinal = pickup || "Contact provider";

      if (!name || !Number.isFinite(qty) || qty <= 0 || !Number.isFinite(price) || price < 0 || !isCategoryValid || !prodDateValue || !expDateValue) {
        notify("Please complete all required fields (name, qty, price, category, dates).", "error");
        return;
      }

      const partnerId = Number(localStorage.getItem("userId"));
      const partnerName = localStorage.getItem("userName") || "Partner";

      if (!Number.isFinite(partnerId) || partnerId <= 0) {
        notify("Missing partner session. Please login again.", "error", true);
        return;
      }

      const payload = {
        name,
        partnerId,
        partnerName,
        listingType: "sale",
        price,
        category,
        quantity: qty,
        imageUrl,
        pickupWindow: pickupFinal,
        expiryDate: toIsoStartOfDay(expDateValue),
        expiryDisplay: expDateValue,
        description: `Production Date: ${prodDateValue}`
      };

      try {
        const res = await fetch(PRODUCTS_API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const result = await res.json().catch(() => null);
        if (!res.ok || !result?.success) {
          console.error("Create sale failed:", res.status, result);
          notify(result?.message || "Failed to create listing.", "error", true);
          return;
        }

        notify("Sale listing created!", "success");
        try {
          const created = result?.data || payload;
          sessionStorage.setItem('lastCreatedProduct', JSON.stringify(created));
        } catch (_) {
          // ignore
        }

        // Role-based notifications
        try {
          const partnerIdTarget = Number(partnerId);
          const partnerNameTarget = String(partnerName || 'Partner');
          if (window.WasteNotNotifications?.notifyTargets && Number.isFinite(partnerIdTarget) && partnerIdTarget > 0) {
            window.WasteNotNotifications.notifyTargets(
              [{ role: 'partner', userId: partnerIdTarget }],
              {
                title: 'Listing created',
                body: `You created "${name}".`,
                link: '/provider/partner-listings.html'
              }
            );

            window.WasteNotNotifications.notifyTargets(
              [{ role: 'consumer', userId: 'all' }],
              {
                title: 'New listing available',
                body: `${partnerNameTarget} posted "${name}".`,
                link: '/consumer/consumer-marketplace.html'
              }
            );
          }
        } catch (_) {
          // ignore
        }

        setTimeout(() => {
          window.location.href = "partner-listings.html";
        }, 800);
      } catch (err) {
        console.error("Create sale error:", err);
        notify("Could not reach marketplace server (8081).", "error", true);
      }
    }

    function bindCreateButton() {
      const createBtn = document.getElementById('createBtn') || document.querySelector('.create-btn');
      if (!createBtn) return;
      createBtn.addEventListener('click', (e) => {
        e.preventDefault();
        createSaleListing();
      });
    }

    // Bind button click explicitly (do not rely on inline handlers).
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bindCreateButton);
    } else {
      bindCreateButton();
    }
  </script>

</body>
</html>
