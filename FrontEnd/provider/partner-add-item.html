<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WasteNot – Add/Edit Inventory Item</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="partner-dashboard.css">
  <link rel="stylesheet" href="partner-inventory.css"> 
</head>

<body>
<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">WasteNot</div>
    </div>

    <nav class="sidebar-nav">
      <a href="partner-dashboard.html" class="nav-item">Dashboard</a>
      <a href="partner-listings.html" class="nav-item">My Listings</a>
      <a href="partner-pickups.html" class="nav-item">Request and Claims</a>
      <a href="partner-inventory.html" class="nav-item active">Inventory</a> <a href="partner-impact.html" class="nav-item">Impact Report</a>
      <a href="partner-settings.html" class="nav-item">Settings</a>
    </nav>

    <button class="logout-btn">Logout</button>
  </aside>

  <main class="main">
    
    <header class="topbar">
      <div>
        <h1 class="topbar-title" id="formPageTitle">Add New Inventory Item</h1>
        <p class="topbar-subtitle">
          Fill in the details for your inventory item.
        </p>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" aria-label="Notifications">
          <span class="notification-count">2</span> 🔔
        </button>
        <div class="avatar" title="Partner User">
          P
        </div>
      </div>
    </header>

    <section class="form-section">
        <div class="form-card">
            <form id="inventoryForm">
                <div class="form-group">
                    <label for="itemName">Item Name</label>
                    <input type="text" id="itemName" name="itemName" placeholder="e.g., Organic Apples" required />
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="itemQuantity">Quantity</label>
                        <input type="number" id="itemQuantity" name="itemQuantity" placeholder="e.g., 10" min="1" required />
                    </div>
                    <div class="form-group">
                        <label for="itemUnit">Unit</label>
                        <input type="text" id="itemUnit" name="itemUnit" placeholder="e.g., kg, pieces, crates" required />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="productionDate">Production Date</label>
                        <input type="date" id="productionDate" name="productionDate" required />
                    </div>
                    <div class="form-group">
                        <label for="expiryDate">Expiry Date</label>
                        <input type="date" id="expiryDate" name="expiryDate" required />
                    </div>
                </div>

                <div class="form-group">
                    <label for="itemDescription">Description (Optional)</label>
                    <textarea id="itemDescription" name="itemDescription" rows="4" placeholder="Any additional details about the item..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Save Item</button>
                    <button type="button" class="btn-secondary" onclick="window.location.href='partner-inventory.html'">Cancel</button>
                </div>
            </form>
        </div>
    </section>

  </main>
</div>

<div id="toast" class="toast">Item saved!</div>

<script src="toast.js"></script>
<script>
    // ========= AUTH GUARD =========
    if (!localStorage.getItem("authToken") || localStorage.getItem("userRole") !== "partner") {
      window.location.href = "../login/login-partner.html";
    }

    // ========= BACKEND API =========
    const PRODUCTS_API = "http://localhost:8081/api/products";

    // ========= FORM HANDLING =========
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const itemId = urlParams.get('id');
        const formPageTitle = document.getElementById('formPageTitle');
        const form = document.getElementById('inventoryForm');
        const partnerId = localStorage.getItem('userId');
        const partnerName = localStorage.getItem('userName');

        // Setup logout
        const logoutBtn = document.querySelector('.logout-btn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', () => {
                localStorage.clear();
                window.location.href = '../login/login-partner.html';
            });
        }

        // If editing, load existing item
        if (itemId) {
            formPageTitle.textContent = 'Edit Inventory Item';
            loadItemForEdit(itemId);
        }

        // Form submission
        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const formData = {
                name: document.getElementById('itemName').value,
                partnerId: parseInt(partnerId),
                partnerName: partnerName,
                category: 'other', // Default category
                description: document.getElementById('itemDescription').value,
                price: 0, // Will be set in listing
                oldPrice: null,
                discountPercent: 0,
                quantity: parseInt(document.getElementById('itemQuantity').value),
                expiryDate: document.getElementById('expiryDate').value + 'T23:59:59',
                expiryDisplay: formatExpiryDisplay(document.getElementById('expiryDate').value),
                pickupWindow: 'Contact provider for pickup details',
                imageUrl: 'https://via.placeholder.com/200',
                status: 'ACTIVE'
            };

            try {
                let response;
                if (itemId) {
                    // UPDATE existing product
                    response = await fetch(`${PRODUCTS_API}/${itemId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('authToken')}`
                        },
                        body: JSON.stringify(formData)
                    });
                } else {
                    // CREATE new product
                    response = await fetch(PRODUCTS_API, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('authToken')}`
                        },
                        body: JSON.stringify(formData)
                    });
                }

                const data = await response.json();
                
                if (data.success) {
                    showToast(itemId ? 'Item updated successfully!' : 'Item added successfully!');
                    setTimeout(() => {
                        window.location.href = 'partner-inventory.html';
                    }, 1500);
                } else {
                    showToast('Error: ' + (data.message || 'Failed to save item'), 'error');
                }
            } catch (error) {
                console.error('Error saving item:', error);
                showToast('Error saving item. Please try again.', 'error');
            }
        });
    });

    // ========= HELPER FUNCTIONS =========
    function formatExpiryDisplay(dateString) {
        const date = new Date(dateString);
        return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    async function loadItemForEdit(itemId) {
        try {
            const response = await fetch(`${PRODUCTS_API}/${itemId}`);
            const data = await response.json();
            
            if (data.success && data.data) {
                const product = data.data;
                document.getElementById('itemName').value = product.name;
                document.getElementById('itemQuantity').value = product.quantity;
                document.getElementById('itemUnit').value = 'units';
                document.getElementById('itemDescription').value = product.description || '';
                
                if (product.expiryDate) {
                    const date = new Date(product.expiryDate);
                    document.getElementById('expiryDate').value = date.toISOString().split('T')[0];
                }
            }
        } catch (error) {
            console.error('Error loading item:', error);
            showToast('Error loading item data', 'error');
        }
    }

    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.background = type === 'error' ? '#ff6b6b' : '#51cf66';
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }
</script>
</body>
</html>
